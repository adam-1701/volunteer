<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>Login - E-Community Service</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <link rel="stylesheet" href="assets/css/templatemo-woox-travel.css">
    <link rel="stylesheet" href="assets/css/owl.css">
    <link rel="stylesheet" href="assets/css/animate.css">
    <link rel="stylesheet"href="https://unpkg.com/swiper@7/swiper-bundle.min.css"/>

    <style>
        /* Custom CSS to center the login form comfortably */
        .login-container {
            padding-top: 150px; /* Push down from header */
            padding-bottom: 100px;
            background-image: url('assets/images/banner-01.jpg'); /* Optional: Add a background image here */
            background-size: cover;
            background-position: center;
        }
        
        .login-card {
            background-color: #fff;
            padding: 60px;
            border-radius: 23px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 500;
            color: #2a2a2a;
        }

        .form-control {
            border-radius: 23px;
            height: 46px;
            border: 1px solid #ddd;
            padding: 0 20px;
        }

        .login-header h2 {
            margin-bottom: 10px;
            font-size: 30px;
            font-weight: 700;
            color: #2a2a2a;
        }

        .login-header p {
            margin-bottom: 30px;
            color: #afafaf;
        }
    </style>

  </head>

<body>

  <header class="header-area header-sticky">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav class="main-nav">
                    <a href="index.html" class="logo">
                        <img src="assets/images/logo.png" alt="E-Community">
                    </a>
                    <ul class="nav">
                        <li><a href="index.html">Dashboard</a></li>
                        <li><a href="register.html" class="active">Register</a></li>
                    </ul>   
                    <a class='menu-trigger'>
                        <span>Menu</span>
                    </a>
                    </nav>
            </div>
        </div>
    </div>
  </header>
  <div class="login-container">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-lg-6 col-md-12">
                  <div class="login-card">
                      <div class="login-header text-center">
                          <h2>Welcome Back</h2>
                          <p>Please login to manage your volunteer hours</p>
                      </div>
                      
                      <form id="loginForm" action="LoginServlet" method="post">
                          
                          <div class="form-group">
                              <label for="email" class="form-label">Email Address</label>
                              <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                          </div>

                          <div class="form-group">
                              <label for="password" class="form-label">Password</label>
                              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                          </div>

                          <div class="form-group d-flex justify-content-between align-items-center">
                              <div class="form-check">
                                  <input type="checkbox" class="form-check-input" id="rememberMe">
                                  <label class="form-check-label" for="rememberMe">Remember me</label>
                              </div>
                              <a href="#" style="color: #22b3c1; font-size: 14px;">Forgot Password?</a>
                          </div>

                          <div class="col-lg-12">
                              <fieldset>
                                  <div class="main-button text-center" style="margin-top: 20px;">
                                      <a href="index.html">Login Now</a>
                                    <!--  <a href="index.html" onclick="document.getElementById('loginForm').submit(); return false;" >Login Now</a> -->
                                  </div>
                              </fieldset>
                          </div>

                      </form>
                      
                      <div class="text-center mt-4">
                          <p>Don't have an account? <a href="register.html" style="color: #22b3c1; font-weight: 600;">Register Here</a></p>
                      </div>

                  </div>
              </div>
          </div>
      </div>
  </div>

  <footer>
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <p>Copyright © 2025 E-Community Service Platform. All rights reserved. 
          <br>Design: <a href="https://templatemo.com" target="_blank" title="free CSS templates">TemplateMo</a></p>
        </div>
      </div>
    </div>
  </footer>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="assets/js/custom.js"></script>

  </body>
</html>
